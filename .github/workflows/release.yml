name: Release

# A merged PR into main → version → Info.plist stamped in the build → tag vX.Y.Z → .app + DMG → GitHub Release.
# Version: CFBundleShortVersionString in Resources/Info.plist when a PR raised it above the last v* tag (pick a version
# by editing it); otherwise the last tag bumped by the PR label major/minor/patch, else by the PR title's
# conventional-commit type (feat!: major, feat: minor), default patch.
# Tag only, no commit back: main is protected (PR + CI) and the Actions bot cannot bypass a ruleset. No loop either:
# the tag is pushed with GITHUB_TOKEN, which never triggers workflows.
# Also: a pushed v* tag releases that tag as-is; workflow_dispatch releases main with a chosen bump.
# A merged PR labelled no-release (docs/ci/chore) cuts nothing. Rules: docs/RELEASING.md.

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ghosttykit:
    name: GhosttyKit
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - uses: ./.github/actions/ghosttykit

  release:
    name: Build & publish
    needs: ghosttykit
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      # Stable self-signed certificate: macOS keeps the app's permissions across updates (decision HD-129).
      # No secrets → no release: an ad-hoc build would silently reset every user's permissions.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.HANGAR_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.HANGAR_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::secrets HANGAR_SIGN_P12 and HANGAR_SIGN_P12_PASSWORD are required: refusing an ad-hoc release"
            exit 1
          fi
          KC="$RUNNER_TEMP/hangar-sign.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASSWORD"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/hangar-sign.p12"
          security import "$RUNNER_TEMP/hangar-sign.p12" -k "$KC" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/hangar-sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          # codesign only finds identities in the user search list; keep the keychains already there
          # (create-keychain may have added ours already).
          KEYCHAINS=("$KC")
          while IFS= read -r k; do
            k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
            if [ -n "$k" ] && [ "$k" != "$KC" ]; then KEYCHAINS+=("$k"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          SHA1="$(security find-identity -p codesigning "$KC" | awk '/"Hangar Self-Signed"/ && !n++ { print $2 }')"
          [ -n "$SHA1" ] || { echo "::error::no \"Hangar Self-Signed\" code-signing identity in HANGAR_SIGN_P12"; exit 1; }
          echo "Signing with $SHA1"
          echo "HANGAR_SIGN_IDENTITY=$SHA1" >> "$GITHUB_ENV"

      - name: Next version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          TITLE: ${{ github.event.pull_request.title }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          PLIST=Resources/Info.plist
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          if [ "$EVENT" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
            NEWEST=$(printf '%s\n%s\n' "${LAST#v}" "$CURRENT" | sort -V | tail -n 1)
            if [ -z "$LAST" ] || { [ "$NEWEST" = "$CURRENT" ] && [ "$CURRENT" != "${LAST#v}" ]; }; then
              VERSION="$CURRENT"  # first release, or Info.plist was raised by hand
            else
              if [ "$EVENT" = workflow_dispatch ]; then BUMP="$BUMP_INPUT"
              elif [[ " $LABELS " == *" major "* ]]; then BUMP=major
              elif [[ " $LABELS " == *" minor "* ]]; then BUMP=minor
              elif [[ " $LABELS " == *" patch "* ]]; then BUMP=patch
              elif [[ "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then BUMP=major
              elif [[ "$TITLE" =~ ^feat(\([^\)]*\))?: ]]; then BUMP=minor
              else BUMP=patch; fi
              IFS=. read -r MA MI PA <<< "${LAST#v}"
              case "$BUMP" in
                major) VERSION="$((MA + 1)).0.0" ;;
                minor) VERSION="$MA.$((MI + 1)).0" ;;
                *)     VERSION="$MA.$MI.$((PA + 1))" ;;
              esac
            fi
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          if [ "$EVENT" != push ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (Info.plist had $CURRENT)"

      - name: Stamp Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git rev-list --count HEAD)" Resources/Info.plist

      - uses: ./.github/actions/setup

      - name: Build Hangar.app
        run: scripts/bundle.sh

      - name: Verify Hangar.app
        env:
          HANGAR_VERIFY_SIGNED: "1"
        run: scripts/verify-bundle.sh build/Hangar.app "${{ steps.version.outputs.version }}"

      - name: Build DMG
        run: |
          scripts/make-dmg.sh
          mv build/Hangar.dmg "build/Hangar-${{ steps.version.outputs.version }}.dmg"
          cd build && shasum -a 256 "Hangar-${{ steps.version.outputs.version }}.dmg" > "Hangar-${{ steps.version.outputs.version }}.dmg.sha256"

      - name: Verify DMG contents
        env:
          HANGAR_VERIFY_SIGNED: "1"
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "build/Hangar-${{ steps.version.outputs.version }}.dmg"
          trap 'hdiutil detach "$MNT" -quiet -force' EXIT
          scripts/verify-bundle.sh "$MNT/Hangar.app" "${{ steps.version.outputs.version }}"

      - name: Tag
        if: steps.version.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Hangar $VERSION" HEAD
          git push origin "v$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ### Install

          1. Download **Hangar-$VERSION.dmg** below, open it and drag **Hangar** to **Applications**.
          2. The build is self-signed (not notarized), so macOS blocks the first launch: right-click Hangar → **Open**, or run
             \`xattr -dr com.apple.quarantine /Applications/Hangar.app\`.
          3. Permissions you grant (screen recording, files and folders…) persist across updates; the first update from an
             older ad-hoc signed build asks for them one last time.

          Requires macOS 14 or later on Apple silicon.
          EOF
          gh release create "v$VERSION" \
            "build/Hangar-$VERSION.dmg" "build/Hangar-$VERSION.dmg.sha256" docs/assets/hangar-demo.mp4 \
            --title "Hangar $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag

      - name: Remove signing keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/hangar-sign.keychain-db"
          rm -f "$RUNNER_TEMP/hangar-sign.p12"
          [ ! -e "$KC" ] || security delete-keychain "$KC"
