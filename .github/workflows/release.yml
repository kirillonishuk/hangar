name: Release

# One release a day, not one per merge (decision HD-145). A release batches the PRs merged into main since the last v*
# tag → version → Info.plist stamped in the build → tag vX.Y.Z → .app + DMG → draft GitHub Release → the draft's DMG is
# downloaded and verified → the draft is published.
# When:
# - daily at 06:00 UTC, if main has PRs since the last tag that are not labelled no-release;
# - on merge of a PR labelled release-now (urgent): releases main right away;
# - workflow_dispatch: releases main now (bump "auto" = from the PRs, patch if none count);
# - a pushed v* tag releases that tag as is.
# Version: CFBundleShortVersionString in Resources/Info.plist when it was raised above the last v* tag; otherwise the
# last tag bumped by the highest bump among the batch's PRs (scripts/release-bump.sh: label major/minor/patch, else the
# title's conventional-commit type). Tag only, no commit back: main is protected and the Actions bot cannot bypass a
# ruleset. No loop either: the tag is pushed with GITHUB_TOKEN, which never triggers workflows. Rules: docs/RELEASING.md.

on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = highest among the PRs since the last tag)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Every merged PR fires this workflow; only a release-now merge joins the "release" group, so the others (skipped at
# once) never replace a release run waiting in the group.
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' || (github.event.pull_request.merged == true &&
    contains(github.event.pull_request.labels.*.name, 'release-now'))) && 'release' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tagged: ${{ steps.plan.outputs.tagged }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: What to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -o pipefail
          SHA=$(git rev-parse HEAD)
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)
          RANGE="${LAST:+$LAST..}$SHA"
          COUNT=$(git rev-list --count "$RANGE")
          # The batch: PRs merged into main whose merge commits are on main's first-parent line since the last tag.
          # A failed API call must fail the step: a half-empty list would give a wrong bump or silently skip the release.
          for c in $(git rev-list --first-parent "$RANGE"); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$c/pulls" \
              --jq '.[] | select(.merged_at != null and .base.ref == "main") | [.number, .title, ([.labels[].name] | join(" "))] | @tsv' || exit 1
          done | sort -t $'\t' -k1,1n -u > "$RUNNER_TEMP/prs.tsv"
          BUMP=$(cut -f2,3 "$RUNNER_TEMP/prs.tsv" | scripts/release-bump.sh)
          echo "Since ${LAST:-the start}: $COUNT commit(s), PRs:"; cat "$RUNNER_TEMP/prs.tsv"; echo "Bump: $BUMP"

          release=true
          if [ "$EVENT" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"; TAGGED=true
          else
            TAGGED=false
            if [ "$COUNT" = 0 ]; then
              echo "::notice::main has nothing new since $LAST"; release=false
            elif [ "$EVENT" = schedule ] && [ "$BUMP" = none ]; then
              echo "::notice::only no-release PRs since $LAST"; release=false
            fi
            [ "$EVENT" = workflow_dispatch ] && [ "$BUMP_INPUT" != auto ] && BUMP="$BUMP_INPUT"
            [ "$BUMP" != none ] || BUMP=patch
            CURRENT=$(git show "$SHA:Resources/Info.plist" |
              python3 -c 'import plistlib, sys; print(plistlib.loads(sys.stdin.buffer.read())["CFBundleShortVersionString"])')
            NEWEST=$(printf '%s\n%s\n' "${LAST#v}" "$CURRENT" | sort -V | tail -n 1)
            if [ -z "$LAST" ] || { [ "$NEWEST" = "$CURRENT" ] && [ "$CURRENT" != "${LAST#v}" ]; }; then
              VERSION="$CURRENT"  # first release, or Info.plist was raised by hand
            else
              IFS=. read -r MA MI PA <<< "${LAST#v}"
              case "$BUMP" in
                major) VERSION="$((MA + 1)).0.0" ;;
                minor) VERSION="$MA.$((MI + 1)).0" ;;
                *)     VERSION="$MA.$MI.$((PA + 1))" ;;
              esac
            fi
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          if [ "$release" = true ] && [ "$EVENT" != push ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

          {
            echo "release=$release"
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "tagged=$TAGGED"
            echo "notes<<HANGAR_NOTES_EOF"
            awk -F'\t' '(" " $3 " ") !~ / no-release / { printf "- %s (#%s)\n", $2, $1 }' "$RUNNER_TEMP/prs.tsv"
            [ -z "$LAST" ] || printf '\n**Full changelog:** https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$LAST" "$VERSION"
            echo "HANGAR_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          [ "$release" = false ] || echo "Releasing $VERSION from $SHA (Info.plist: ${CURRENT:-n/a})"

  ghosttykit:
    name: GhosttyKit
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/ghosttykit

  release:
    name: Build & publish
    needs: [plan, ghosttykit]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      # Stable self-signed certificate: macOS keeps the app's permissions across updates (decision HD-129).
      # No secrets → no release: an ad-hoc build would silently reset every user's permissions.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.HANGAR_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.HANGAR_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::secrets HANGAR_SIGN_P12 and HANGAR_SIGN_P12_PASSWORD are required: refusing an ad-hoc release"
            exit 1
          fi
          KC="$RUNNER_TEMP/hangar-sign.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASSWORD"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/hangar-sign.p12"
          security import "$RUNNER_TEMP/hangar-sign.p12" -k "$KC" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/hangar-sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          # codesign only finds identities in the user search list; keep the keychains already there
          # (create-keychain may have added ours already).
          KEYCHAINS=("$KC")
          while IFS= read -r k; do
            k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
            if [ -n "$k" ] && [ "$k" != "$KC" ]; then KEYCHAINS+=("$k"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          SHA1="$(security find-identity -p codesigning "$KC" | awk '/"Hangar Self-Signed"/ && !n++ { print $2 }')"
          [ -n "$SHA1" ] || { echo "::error::no \"Hangar Self-Signed\" code-signing identity in HANGAR_SIGN_P12"; exit 1; }
          echo "Signing with $SHA1"
          echo "HANGAR_SIGN_IDENTITY=$SHA1" >> "$GITHUB_ENV"

      - name: Stamp Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git rev-list --count HEAD)" Resources/Info.plist

      - uses: ./.github/actions/setup

      - name: Build Hangar.app
        run: scripts/bundle.sh

      - name: Verify Hangar.app
        env:
          HANGAR_VERIFY_SIGNED: "1"
        run: scripts/verify-bundle.sh build/Hangar.app "$VERSION"

      - name: Build DMG
        run: |
          scripts/make-dmg.sh
          mv build/Hangar.dmg "build/Hangar-$VERSION.dmg"
          cd build && shasum -a 256 "Hangar-$VERSION.dmg" > "Hangar-$VERSION.dmg.sha256"

      - name: Verify DMG contents
        env:
          HANGAR_VERIFY_SIGNED: "1"
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "build/Hangar-$VERSION.dmg"
          trap 'hdiutil detach "$MNT" -quiet -force' EXIT
          scripts/verify-bundle.sh "$MNT/Hangar.app" "$VERSION"

      - name: Tag
        if: needs.plan.outputs.tagged == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Hangar $VERSION" HEAD
          git push origin "v$VERSION"

      # Draft first: users see nothing until the draft's own assets pass the checks below.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ needs.plan.outputs.notes }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ### Install

          1. Download **Hangar-$VERSION.dmg** below, open it and drag **Hangar** to **Applications**.
          2. The build is self-signed (not notarized), so macOS blocks the first launch: right-click Hangar → **Open**, or run
             \`xattr -dr com.apple.quarantine /Applications/Hangar.app\`.
          3. Permissions you grant (screen recording, files and folders…) persist across updates; the first update from an
             older ad-hoc signed build asks for them one last time.

          Requires macOS 14 or later on Apple silicon.

          ### Changes

          EOF
          printf '%s\n' "$CHANGES" >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --draft \
            "build/Hangar-$VERSION.dmg" "build/Hangar-$VERSION.dmg.sha256" docs/assets/hangar-demo.mp4 \
            --title "Hangar $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # What users would download, checked without a human: checksum, version, signature. Launching it stays with the owner.
      - name: Verify the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR=$(mktemp -d); cd "$DIR"
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p "Hangar-$VERSION.dmg*"
          shasum -a 256 -c "Hangar-$VERSION.dmg.sha256"
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "Hangar-$VERSION.dmg"
          trap 'hdiutil detach "$MNT" -quiet -force' EXIT
          APP="$MNT/Hangar.app"
          GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          [ "$GOT" = "$VERSION" ] || { echo "::error::draft app is $GOT, tag is v$VERSION"; exit 1; }
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -qx 'Authority=Hangar Self-Signed' ||
            { echo "::error::draft app is not signed by Hangar Self-Signed"; exit 1; }
          echo "v$VERSION verified: sha256, CFBundleShortVersionString, codesign --deep --strict, Hangar Self-Signed"

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false

      - name: Remove signing keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/hangar-sign.keychain-db"
          rm -f "$RUNNER_TEMP/hangar-sign.p12"
          [ ! -e "$KC" ] || security delete-keychain "$KC"
