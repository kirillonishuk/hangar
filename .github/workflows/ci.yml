name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit authorship
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Owner-only authors, no Co-Authored-By
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh "$RANGE"

  ghosttykit:
    name: GhosttyKit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ghosttykit

  build-test:
    name: Build & test
    needs: ghosttykit
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Tests create commits in temporary repositories.
      - name: Git identity for tests
        run: |
          git config --global user.name "Hangar CI"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Build
        run: swift build

      # The project's source language; tests pin L10n themselves and also pass under en, de and ja.
      - name: System language ru
        run: defaults write -g AppleLanguages -array ru en

      # Serial: hosted runners have 3 cores, and the suite's process/socket tests starve each other in parallel
      # (20 s timeouts blown); serially the suite takes a few minutes. One retry absorbs a cold-runner hiccup.
      - name: Test
        run: |
          swift test --no-parallel && exit 0
          echo "::warning::Test run failed; retrying once"
          swift test --no-parallel
