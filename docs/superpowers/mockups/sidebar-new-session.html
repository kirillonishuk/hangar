<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Hangar — «Новая сессия» в сайдбаре</title>
<!--
  Верх сайдбара: «Новая сессия» + «Сессии», ниже SSH-ХОСТЫ / ПРОЕКТЫ для контекста.
  Сейчас — контурная кнопка с ⌘N (FilledRowStyle(outlined: true)); три замены по языку B′ (DESIGN.md «Язык контролов»):
  клавиши только в тултипе «Действие — клавиша», одна акцентная заливка на область.
  Токены — ThemePalette.navy / .darkPlus; размеры pt = px 1:1 (Theme, Theme+Sidebar): ширина 260, строка 32, маркер x 22,
  текст x 34, подсветка с отступом 8 и радиусом 8, заголовок секции 11.5 semibold +0.06em с x 20.
  Тема: #navy или #darkplus в адресе (без — обе). Наведение работает живьём; колонка «наведение» показывает его статично.
-->
<style>
*{box-sizing:border-box}
.navy{
  --sidebar:#1d2534;--sbHover:#273044;--hoverStrong:#2b3444;--selected:#2e3749;--line:#222b3b;--controlStrong:#3a4456;
  --tx:#e3e7ef;--strong:#ffffff;--tx2:#9ba4b7;--tx3:#687185;--accent:#4ea1f3;--accentText:#5fb0ff;
  --primary:#2a6fd6;--primaryHover:#3a7ee3;--primaryText:#ffffff;--working:#4fc1ff;--waiting:#ffb340;--done:#73c991;--idle:#5f687a;
  --tint:rgba(78,161,243,.14);--tintHover:rgba(78,161,243,.22);--page:#0d121c;--card:#151c2a;
}
.darkplus{
  --sidebar:#252526;--sbHover:#2a2d2e;--hoverStrong:#37373d;--selected:#37373d;--line:#333333;--controlStrong:#454545;
  --tx:#cccccc;--strong:#ffffff;--tx2:#a3a3a3;--tx3:#6e6e6e;--accent:#007acc;--accentText:#3794ff;
  --primary:#0e639c;--primaryHover:#1177bb;--primaryText:#ffffff;--working:#4fc1ff;--waiting:#e8a33d;--done:#89d185;--idle:#6e6e6e;
  --tint:rgba(0,122,204,.16);--tintHover:rgba(0,122,204,.26);--page:#161616;--card:#1c1c1c;
}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
.theme{background:var(--page);color:var(--tx2);padding:28px 32px 34px;width:max-content}
.theme h1{margin:0 0 4px;font-size:20px;font-weight:600;color:var(--strong);letter-spacing:-.005em}
.theme .lead{margin:0 0 22px;font-size:13.5px;max-width:980px}
.grid{display:grid;grid-template-columns:repeat(4,auto);gap:26px}
.col h2{margin:0 0 3px;font-size:15px;font-weight:600;color:var(--strong)}
.col .note{margin:0 0 12px;font-size:12.5px;line-height:1.45;width:540px;min-height:54px}
.col.rec h2::after{content:"рекомендую";margin-left:10px;font-size:11.5px;font-weight:500;color:var(--done);border:1px solid color-mix(in srgb,var(--done) 40%,transparent);border-radius:9px;padding:1px 8px;vertical-align:2px}
.pair{display:flex;gap:20px}
.state{font-size:11.5px;color:var(--tx3);margin-bottom:6px}

/* ===== sidebar (SidebarView) ===== */
.sb{width:260px;height:322px;background:var(--sidebar);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;
    font-size:13.5px;color:var(--tx);padding-top:8px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.row{position:relative;height:32px;display:flex;align-items:center;padding-left:34px;padding-right:18px;cursor:pointer;white-space:nowrap}
.row::before{content:"";position:absolute;inset:0 8px;border-radius:8px;background:transparent;transition:background .12s}
.row>*{position:relative}
.row .mk{position:absolute;left:14px;top:8px;width:16px;height:16px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.row .sp{flex:1}
.row .kbd{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.row .sub{font-size:12px;color:var(--tx3);margin-left:8px}
.row.h::before,.row:hover::before{background:var(--sbHover)}
.row.sel::before{background:var(--selected)}
.dot{width:8px;height:8px;border-radius:50%}
.sess{padding-left:48px}
.sess .mk{left:26px}
.hdr{height:28px;margin-top:8px;display:flex;align-items:center;padding-left:20px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--tx3)}

/* the new-session control, per variant */
.nt{margin:8px 0 4px}
/* current: outlined, accent text, ⌘N */
.v0 .nt::before{background:transparent;border:1px solid var(--controlStrong)}
.v0 .nt.h::before,.v0 .nt:hover::before{background:var(--sbHover)}
.v0 .nt,.v0 .nt .mk{color:var(--accentText)}
/* A: soft accent tint, no border */
.vA .nt::before{background:var(--tint)}
.vA .nt.h::before,.vA .nt:hover::before{background:var(--tintHover)}
.vA .nt{color:var(--accentText);font-weight:500}
.vA .nt .mk{color:var(--accentText)}
/* B: plain row, accent + */
.vB .nt{margin:8px 0 0}
.vB .nt .mk{color:var(--accentText)}
/* C: compact filled primary, centred */
.vC .nt{height:30px;margin:8px 0 6px;padding:0;justify-content:center;gap:7px;color:var(--primaryText);font-size:13px;font-weight:500}
.vC .nt::before{background:var(--primary);border-radius:7px}
.vC .nt.h::before,.vC .nt:hover::before{background:var(--primaryHover)}
.vC .nt .mk{position:relative;left:auto;top:auto;color:var(--primaryText);width:14px;height:14px}

/* macOS tooltip (shown in the hover frame) */
.tip{position:absolute;z-index:3;background:#2c2c2e;color:#e8e8e8;border:1px solid #4a4a4c;border-radius:6px;padding:3px 8px;font-size:11.5px;
     white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.cur{position:absolute;z-index:2;width:14px;height:17px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="g-add" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="g-history" viewBox="0 0 16 16"><path d="M1.75 8A6.25 6.25 0 1 0 3.58 3.58L1.75 5.4M1.75 2.25V5.4H4.9M8 4.75V8l2.25 1.5"/></symbol>
  <symbol id="g-ssh" viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="4.5" rx="2"/><rect x="1.75" y="8.75" width="12.5" height="4.5" rx="2"/><path d="M4.75 5h.01M4.75 11h.01"/></symbol>
  <symbol id="g-project" viewBox="0 0 16 16"><path d="M3.75 2.75h2.6l1.6 1.75h4.3a2 2 0 0 1 2 2v4.75a2 2 0 0 1-2 2h-8.5a2 2 0 0 1-2-2v-6.5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="g-hand" viewBox="0 0 14 17"><path d="M4.5 8V2.2a1.1 1.1 0 0 1 2.2 0V7.5V6.3a1.1 1.1 0 0 1 2.2 0v1.4-.8a1.1 1.1 0 0 1 2.2 0v1.2a1.1 1.1 0 0 1 2.1.2v3.4c0 2.4-1.7 4.3-4.2 4.3H7.4c-1.4 0-2.4-.6-3.2-1.7L1.3 10.2a1.15 1.15 0 0 1 1.7-1.5z" fill="#fff" stroke="#000" stroke-width=".9" stroke-linejoin="round"/></symbol>
</svg>

<template id="tpl-sb">
  <div class="sb">
    <div class="row nt"><span class="mk"><svg class="i" width="16" height="16"><use href="#g-add"/></svg></span><span class="lbl">Новая сессия</span><span class="sp"></span><span class="kbd k1">⌘N</span></div>
    <div class="row"><span class="mk"><svg class="i" width="16" height="16"><use href="#g-history"/></svg></span>Сессии<span class="sp"></span><span class="kbd k2">⌘Y</span></div>
    <div class="hdr">SSH-ХОСТЫ</div>
    <div class="row"><span class="mk"><svg class="i" width="13" height="13"><use href="#g-ssh"/></svg></span>devbox<span class="sub">подключён</span></div>
    <div class="hdr">ПРОЕКТЫ</div>
    <div class="row"><span class="mk"><svg class="i" width="16" height="16"><use href="#g-project"/></svg></span>hangar</div>
    <div class="row sess"><span class="mk"><span class="dot" style="background:var(--working)"></span></span>кнопка в сайдбаре</div>
    <div class="row sess sel"><span class="mk"><span class="dot" style="background:var(--waiting)"></span></span><span style="color:var(--strong)">темы редактора</span></div>
  </div>
</template>

<div id="root"></div>

<script>
const VARIANTS = [
  {cls:'v0', name:'Сейчас', keys:true,
   note:'Контур controlStrong + акцентный текст + ⌘N внутри. Рамка в сайдбаре больше нигде не встречается, кнопка выглядит как поле ввода; ⌘N и ⌘Y — шум.'},
  {cls:'vA', name:'A — мягкая заливка', rec:true,
   note:'Заливка accent 14 % (наведение 22 %), текст и + accentText 500, без рамки и клавиш. Одно акцентное пятно в сайдбаре; геометрия строки та же (32, маркер на x 22) — в рейле остаётся «+» на тинте.'},
  {cls:'vB', name:'B — обычная строка',
   note:'Как «Сессии»: строка 32, наведение sbHover; акцентный только «+». Тихо и ровно, но действие не отличить от навигации — главную кнопку сайдбара глазом не найти.'},
  {cls:'vC', name:'C — компактная primary',
   note:'Сплошная primary 30, радиус 7, «+» и подпись по центру, 13 medium. Самая заметная — громче выбранной строки и статусов; в рейле — квадрат primary 28.'},
];
const THEMES = [['navy','Navy'],['darkplus','Dark+']];
const want = location.hash.slice(1);
const root = document.getElementById('root');
const tpl = document.getElementById('tpl-sb');

for (const [t, title] of THEMES) {
  if (want && want !== t) continue;
  const sec = document.createElement('section');
  sec.className = 'theme ' + t;
  sec.innerHTML = `<h1>«Новая сессия» в сайдбаре — ${title}</h1>
    <p class="lead">Верх сайдбара шириной 260 в покое и под курсором. Клавиши уходят в тултип «Новая сессия — ⌘N» / «Сессии — ⌘Y» (язык B′), в строках их нет ни в одном варианте, кроме текущего.</p>
    <div class="grid"></div>`;
  const grid = sec.querySelector('.grid');
  for (const v of VARIANTS) {
    const col = document.createElement('div');
    col.className = 'col ' + v.cls + (v.rec ? ' rec' : '');
    col.innerHTML = `<h2>${v.name}</h2><p class="note">${v.note}</p><div class="pair"></div>`;
    col.querySelector('.note').style.width = '540px';
    const pair = col.querySelector('.pair');
    for (const hover of [false, true]) {
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="state">${hover ? 'наведение' : 'покой'}</div>`;
      const sb = tpl.content.firstElementChild.cloneNode(true);
      if (!v.keys) sb.querySelectorAll('.kbd').forEach(k => k.remove());
      if (v.cls === 'vC') sb.querySelector('.nt .sp')?.remove();
      if (hover) {
        const nt = sb.querySelector('.nt');
        nt.classList.add('h');
        const top = v.cls === 'vC' ? 16 : 18;
        sb.insertAdjacentHTML('beforeend',
          `<svg class="cur" style="left:${v.cls==='vC'?178:150}px;top:${top+8}px"><use href="#g-hand"/></svg>` +
          (v.keys ? '' : `<div class="tip" style="left:${v.cls==='vC'?110:120}px;top:${top+30}px">Новая сессия — ⌘N</div>`));
      }
      wrap.appendChild(sb);
      pair.appendChild(wrap);
    }
    grid.appendChild(col);
  }
  root.appendChild(sec);
}
</script>
</body></html>
